name: Release & Build APK

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type (auto detects based on conventional commits)'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  release:
    name: Semantic Release & APK Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Pre-flight Verification Gate
        run: |
          npm run typecheck
          npm run test

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine Semantic Version Bump
        id: versioning
        run: |
          # Get latest git tag or default to v1.0.0
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LATEST_TAG" ]; then
            CURRENT_VER="1.0.0"
            REV_RANGE="HEAD"
          else
            CURRENT_VER="${LATEST_TAG#v}"
            REV_RANGE="${LATEST_TAG}..HEAD"
          fi

          echo "Current version: $CURRENT_VER"
          echo "Comparing range: $REV_RANGE"

          BUMP="${{ github.event.inputs.bump }}"

          if [ "$BUMP" = "auto" ]; then
            COMMITS=$(git log $REV_RANGE --pretty=format:"%s")
            if echo "$COMMITS" | grep -qE "BREAKING CHANGE|!: "; then
              BUMP="major"
            elif echo "$COMMITS" | grep -qE "^feat(\(.*\))?:"; then
              BUMP="minor"
            else
              BUMP="patch"
            fi
          fi

          echo "Selected bump: $BUMP"

          # Parse major, minor, patch
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VER"

          case "$BUMP" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_VER="${MAJOR}.${MINOR}.${PATCH}"
          NEW_TAG="v${NEW_VER}"

          echo "New Version: $NEW_VER"
          echo "New Tag: $NEW_TAG"

          echo "new_version=$NEW_VER" >> $GITHUB_OUTPUT
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT

      - name: Bump package.json and app.json
        env:
          NEW_VER: ${{ steps.versioning.outputs.new_version }}
          NEW_TAG: ${{ steps.versioning.outputs.new_tag }}
        run: |
          # Bump package.json
          npm version $NEW_VER --no-git-tag-version

          # Bump app.json
          node -e "
            const fs = require('fs');
            const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            app.expo.version = '$NEW_VER';
            fs.writeFileSync('app.json', JSON.stringify(app, null, 2) + '\n');
          "

          # Commit and Tag
          git add package.json package-lock.json app.json
          git commit -m "chore(release): bump version to $NEW_TAG [skip ci]"
          git tag "$NEW_TAG"
          git push origin main --tags

      - name: Setup Expo & EAS
        if: env.EXPO_TOKEN != ''
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build Standalone Android APK via EAS
        if: env.EXPO_TOKEN != ''
        id: eas_build
        run: |
          echo "Triggering EAS Android build..."
          eas build --platform android --profile preview --non-interactive --wait --output="./CTracker-${{ steps.versioning.outputs.new_tag }}.apk"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Create GitHub Release with APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.versioning.outputs.new_tag }}
        run: |
          APK_FILE="./CTracker-${TAG}.apk"
          if [ -f "$APK_FILE" ]; then
            gh release create "$TAG" "$APK_FILE" \
              --title "Release $TAG" \
              --generate-notes
          else
            gh release create "$TAG" \
              --title "Release $TAG" \
              --generate-notes
          fi
