[project]
name = "ctracker"
version = "1.0.0"
description = "Self-hosted calorie tracking API with dynamic TDEE estimation."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.0",
    "uvicorn[standard]>=0.53.0",
    "sqlalchemy>=2.0.54",
    "pydantic>=2.13.0",
    "pydantic-settings>=2.15.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.2.0",
    "python-multipart>=0.0.32",
    "python-telegram-bot>=22.8",
    "google-genai>=2.25.0",
    "openpyxl>=3.1.5",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.9.0",
    "pre-commit>=4.1.0",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort / import sorting
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line length (handled by ruff format)
    "B008",  # FastAPI Depends/Query/File function calls in parameter defaults
]
[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning:starlette.*",
    "ignore::Warning:fastapi.testclient",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
